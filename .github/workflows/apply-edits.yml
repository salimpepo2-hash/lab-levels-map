name: Apply edits

# How to use: an Issue (written by the repo owner) contains a JSON block of exact edits.
# The owner comments "/apply" on that Issue. The edits are applied to the dev branch,
# checked with the map build, and only then committed. Nothing touches main.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-edits
  cancel-in-progress: false

jobs:
  apply:
    name: Apply edits to dev
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/apply')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to dev (create from main if missing)
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            if git merge-base --is-ancestor origin/dev origin/main; then
              echo "dev is already merged into main, restarting it from main"
              git checkout -B dev origin/main
            else
              git checkout -B dev origin/dev
            fi
          else
            git checkout -B dev origin/main
          fi

      - name: Apply edits (all or nothing)
        run: |
          python3 - <<'PY'
          import json, os, re, sys, fnmatch
          from pathlib import PurePosixPath

          REPORT = "/tmp/apply_report.txt"
          MSG = "/tmp/commit_msg.txt"

          def fail(msg):
              with open(REPORT, "w", encoding="utf-8") as f:
                  f.write(msg)
              print(msg)
              sys.exit(1)

          body = os.environ.get("ISSUE_BODY", "") or ""
          m = re.search(r"```json\s*(.*?)```", body, re.S)
          raw = m.group(1) if m else body
          try:
              spec = json.loads(raw)
          except Exception as e:
              fail("The Issue does not contain valid JSON: %s" % e)

          if not isinstance(spec, dict):
              fail("The JSON must be an object with title and edits.")
          title = str(spec.get("title", "")).strip()
          edits = spec.get("edits")
          if not title or len(title) > 100:
              fail("Missing title (max 100 characters).")
          if not isinstance(edits, list) or not (1 <= len(edits) <= 60):
              fail("edits must be a list of 1 to 60 items.")

          BLOCKED_DIRS = {".git", ".github"}
          # generated files: never edited by hand, the build rewrites them
          BLOCKED_FILES = {"docs/data/built.json", "data/cache/routes.json"}
          BLOCKED_NAMES = [".env", "*.pem", "*.key", "*.p12"]

          def check_path(p):
              if not isinstance(p, str) or not p or "\\" in p or "\x00" in p:
                  fail("Bad file path: %r" % (p,))
              pp = PurePosixPath(p)
              if pp.is_absolute() or ".." in pp.parts:
                  fail("Path must be relative inside the repo: %s" % p)
              if pp.parts[0] in BLOCKED_DIRS:
                  fail("Editing %s is not allowed." % p)
              if str(pp) in BLOCKED_FILES:
                  fail("Editing %s is not allowed (generated by the build)." % p)
              for pat in BLOCKED_NAMES:
                  if fnmatch.fnmatch(pp.name, pat):
                      fail("Editing %s is not allowed (sensitive file)." % p)
              return str(pp)

          state = {}   # path -> [text, crlf, existed]

          def load(path):
              if path in state:
                  return state[path]
              if not os.path.isfile(path):
                  fail("File not found: %s" % path)
              data = open(path, "rb").read()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  fail("File is not UTF-8 text: %s" % path)
              crlf = "\r\n" in text
              state[path] = [text.replace("\r\n", "\n"), crlf, True]
              return state[path]

          for i, e in enumerate(edits, 1):
              if not isinstance(e, dict):
                  fail("Edit %d is not an object." % i)
              path = check_path(e.get("file"))
              if "create" in e:
                  if os.path.exists(path) or path in state:
                      fail("Edit %d: %s already exists, cannot create." % (i, path))
                  content = e["create"]
                  if not isinstance(content, str):
                      fail("Edit %d: create must be text." % i)
                  state[path] = [content.replace("\r\n", "\n"), False, False]
                  continue
              find, repl = e.get("find"), e.get("replace")
              if not isinstance(find, str) or not isinstance(repl, str) or find == "":
                  fail("Edit %d (%s): find and replace must be text, find not empty." % (i, path))
              if find == repl:
                  fail("Edit %d (%s): find and replace are identical." % (i, path))
              find = find.replace("\r\n", "\n")
              repl = repl.replace("\r\n", "\n")
              st = load(path)
              n = st[0].count(find)
              if n != 1:
                  first = find.strip().split("\n")[0][:120]
                  fail("Edit %d (%s): the text to find appears %d times (needs exactly 1). Starts with: %s" % (i, path, n, first))
              st[0] = st[0].replace(find, repl, 1)

          for path, (text, crlf, existed) in state.items():
              out = text.replace("\n", "\r\n") if crlf else text
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "wb") as f:
                  f.write(out.encode("utf-8"))

          with open(MSG, "w", encoding="utf-8") as f:
              f.write("%s\n\nApplied from Issue #%s (%d edits in %d files)\n" % (
                  title, os.environ.get("ISSUE_NUMBER", "?"), len(edits), len(state)))
          print("OK: %d edits in %d files" % (len(edits), len(state)))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild map data (levels, nearest, road routes) and check
        run: |
          node scripts/build.mjs --strict 2>&1 | tee /tmp/build.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Commit and push to dev
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes were produced." > /tmp/apply_report.txt
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F /tmp/commit_msg.txt
          git push --force-with-lease origin dev
          SHA=$(git rev-parse --short HEAD)
          gh issue comment "$ISSUE_NUMBER" --body "Done. Applied to the dev branch as commit $SHA and it rebuilt successfully (levels, nearest and road minutes recalculated, docs/data/built.json and the routes cache updated in the same commit). To undo: revert that commit on dev, or delete dev and recreate it from main. main was not touched."

      - name: Report failure on the Issue
        if: failure()
        run: |
          {
            echo "Nothing was changed on any branch."
            echo
            if [ -s /tmp/apply_report.txt ]; then
              echo "Reason:"
              cat /tmp/apply_report.txt
            else
              echo "The edits applied but the map build failed (last lines):"
              echo '```'
              tail -n 25 /tmp/build.txt 2>/dev/null || echo "see the Actions run log"
              echo '```'
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/fail_comment.txt
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/fail_comment.txt
